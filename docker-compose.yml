version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ridesharing-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://rideshare:rideshare123@postgres:5432/ridesharing_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ridesharing-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: ridesharing-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=rideshare
      - POSTGRES_PASSWORD=rideshare123
      - POSTGRES_DB=ridesharing_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ridesharing-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
